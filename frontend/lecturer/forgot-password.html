<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Lecturer Password — CA & Complaint System</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <div class="auth-page">
    
    <!-- Left Hero Panel -->
    <div class="auth-hero lecturer-hero">
      <div class="hero-blob hero-blob-1" style="background: var(--accent);"></div>
      <div class="hero-blob hero-blob-2" style="background: rgba(15,76,92,0.3);"></div>
      
      <div class="hero-badge" style="background: rgba(255,255,255,0.15);">
        <i class="bi bi-key-fill hero-icon"></i>
        <span>Faculty Account Recovery</span>
      </div>
      
      <h1 class="hero-title">Faculty Password <span>Reset</span></h1>
      <p class="hero-desc">Enter your institutional email address to verify faculty record and update your portal password.</p>
    </div>
    
    <!-- Right Form Panel -->
    <div class="auth-form-panel">
      <div class="auth-form-card">
        
        <div class="auth-form-top">
          <a href="../index.html" class="auth-logo">
            <div class="auth-logo-icon lecturer-icon">
              <i class="bi bi-person-lines-fill"></i>
            </div>
            <span class="auth-logo-text">Lecturer Portal</span>
          </a>
          <a href="login.html" class="btn btn-outline btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Login
          </a>
        </div>
        
        <div class="auth-heading">
          <h1>Forgot Password</h1>
          <p>Reset your faculty account credentials.</p>
        </div>
        
        <form class="auth-form" id="lecturer-reset-form" novalidate>
          
          <!-- Institutional Email -->
          <div class="form-group">
            <label class="form-label" for="email">Institutional Email<span class="required">*</span></label>
            <div class="input-wrapper">
              <i class="bi bi-envelope input-icon"></i>
              <input type="email" id="email" class="form-control lecturer-focus" placeholder="musa@university.edu.ng" required>
            </div>
          </div>

          <!-- New Password -->
          <div class="form-group">
            <label class="form-label" for="newPassword">New Password<span class="required">*</span></label>
            <div class="password-wrapper">
              <div class="input-wrapper">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" id="newPassword" class="form-control lecturer-focus" placeholder="••••••••" required>
              </div>
              <button type="button" class="eye-toggle"><i class="bi bi-eye"></i></button>
            </div>
          </div>

          <!-- Confirm New Password -->
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm New Password<span class="required">*</span></label>
            <div class="password-wrapper">
              <div class="input-wrapper">
                <i class="bi bi-lock-fill input-icon"></i>
                <input type="password" id="confirmPassword" class="form-control lecturer-focus" placeholder="••••••••" required>
              </div>
              <button type="button" class="eye-toggle"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          
          <!-- Submit -->
          <button type="submit" class="auth-submit lecturer-btn">
            <span class="spinner"></span>
            <span class="btn-label"><i class="bi bi-check-circle-fill"></i> Reset Password</span>
          </button>
          
        </form>
        
        <div class="auth-switch">
          Remembered your password? <a href="login.html" class="lecturer-link">Sign In Here</a>
        </div>
        
      </div>
    </div>
    
  </div>

  <!-- Scripts -->
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
