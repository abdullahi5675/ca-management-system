<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Student Password — CA & Complaint System</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <div class="auth-page">
    
    <!-- Left Hero Panel -->
    <div class="auth-hero student-hero">
      <div class="hero-blob hero-blob-1"></div>
      <div class="hero-blob hero-blob-2"></div>
      
      <div class="hero-badge">
        <i class="bi bi-key-fill hero-icon"></i>
        <span>Student Identity Verification</span>
      </div>
      
      <h1 class="hero-title">Reset Your <span>Password</span></h1>
      <p class="hero-desc">Provide your matriculation number to verify your student record and choose a new secure password.</p>
    </div>
    
    <!-- Right Form Panel -->
    <div class="auth-form-panel">
      <div class="auth-form-card">
        
        <div class="auth-form-top">
          <a href="../index.html" class="auth-logo">
            <div class="auth-logo-icon">
              <i class="bi bi-mortarboard-fill"></i>
            </div>
            <span class="auth-logo-text">CA Portal</span>
          </a>
          <a href="login.html" class="btn btn-outline btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Login
          </a>
        </div>
        
        <div class="auth-heading">
          <h1>Forgot Password</h1>
          <p>Reset student account credentials by confirming matric number.</p>
        </div>
        
        <form class="auth-form" id="student-reset-form" novalidate>
          
          <!-- Registration Number -->
          <div class="form-group">
            <label class="form-label" for="reg_number">Matric / Registration Number<span class="required">*</span></label>
            <div class="input-wrapper">
              <i class="bi bi-card-text input-icon"></i>
              <input type="text" id="reg_number" class="form-control text-uppercase" placeholder="CSC/2022/001" required>
            </div>
          </div>

          <!-- New Password -->
          <div class="form-group">
            <label class="form-label" for="newPassword">New Password<span class="required">*</span></label>
            <div class="password-wrapper">
              <div class="input-wrapper">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required>
              </div>
              <button type="button" class="eye-toggle"><i class="bi bi-eye"></i></button>
            </div>
          </div>

          <!-- Confirm New Password -->
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm New Password<span class="required">*</span></label>
            <div class="password-wrapper">
              <div class="input-wrapper">
                <i class="bi bi-lock-fill input-icon"></i>
                <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
              </div>
              <button type="button" class="eye-toggle"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          
          <!-- Submit -->
          <button type="submit" class="auth-submit student-btn">
            <span class="spinner"></span>
            <span class="btn-label"><i class="bi bi-check-circle-fill"></i> Reset Password</span>
          </button>
          
        </form>
        
        <div class="auth-switch">
          Remembered your password? <a href="login.html">Sign In Here</a>
        </div>
        
      </div>
    </div>
    
  </div>

  <!-- Scripts -->
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
